# 올릴 때마다 전체 시험을 돌린다 — 리브레오피스로 수식 조서를 다시 계산하는 시험까지 포함한다.
# (리브레오피스가 없으면 그 시험들이 빠진 채 통과해 보이므로, 여기서는 반드시 설치한다.)
name: 전체 시험

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 리브레오피스 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          libreoffice --version
      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: 전체 시험
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest -q tests/
